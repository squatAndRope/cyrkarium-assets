<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyrkarium – Assets</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --violet:#4B3373; --lilac:#CAC2DF; --green:#3D562B; --lime:#D1DFA8;
    --bg:#f7f5fb; --card:#ffffff; --text:#2b2b2b; --muted:#6f6a7a; --line:#e4dff0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--violet);color:#fff;padding:28px 20px 22px}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  header .wrap{padding:0}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;color:var(--lilac);font-size:14px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .bar input{flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:0;font-size:14px}
  .bar select{padding:10px;border-radius:8px;border:0;font-size:14px}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
  nav a{background:var(--card);border:1px solid var(--line);color:var(--violet);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:13px}
  nav a:hover{background:var(--lilac)}
  section{margin:22px 0 34px}
  h2{font-size:17px;color:var(--violet);border-bottom:2px solid var(--lime);padding-bottom:6px;margin:0 0 14px;text-transform:capitalize}
  h2 small{color:var(--muted);font-weight:normal;font-size:13px;text-transform:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{height:160px;display:flex;align-items:center;justify-content:center;padding:12px;
    background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
  .dark .thumb{background-color:#222;background-image:none}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .thumb .file{font-size:30px;color:var(--muted)}
  .meta{padding:10px 12px;font-size:12px;border-top:1px solid var(--line);flex:1}
  .name{font-weight:600;word-break:break-all;margin-bottom:2px}
  .dims{color:var(--muted)}
  .actions{display:flex;border-top:1px solid var(--line)}
  .actions button,.actions a{flex:1;border:0;background:none;padding:9px 4px;font-size:12px;cursor:pointer;color:var(--violet);text-decoration:none;text-align:center}
  .actions > *+*{border-left:1px solid var(--line)}
  .actions button:hover,.actions a:hover{background:var(--lilac)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .25s}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .status{padding:40px 0;color:var(--muted);text-align:center}
  label.toggle{color:#fff;font-size:13px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Cyrkarium · Assets</h1>
    <p>Kliknij „Kopiuj link”, żeby wkleić grafikę do maila, stopki, Carrd czy newslettera.</p>
    <div class="bar">
      <input id="q" type="search" placeholder="Szukaj pliku…">
      <label class="toggle"><input type="checkbox" id="dark"> ciemne tło</label>
    </div>
  </div>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <div id="app"><div class="status">Ładowanie…</div></div>
</div>
<div class="toast" id="toast">Skopiowano ✓</div>

<script>
// Repozytorium z plikami — zmień, jeśli przeniesiesz repo
const OWNER = "squatAndRope";
const REPO  = "cyrkarium-assets";
const BRANCH = "main";

const IMG = /\.(png|jpe?g|gif|webp|svg|avif)$/i;
const OTHER = /\.(pdf|ai|eps|psd|zip)$/i;
const BASE = new URL(".", location.href).href; // działa i na github.io, i na własnej domenie

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const toast = document.getElementById("toast");

const urlFor = p => BASE + p.split("/").map(encodeURIComponent).join("/");
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.round(n/1024)+" KB";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function copy(text, msg){
  navigator.clipboard.writeText(text).then(()=>{
    toast.textContent = msg || "Skopiowano ✓";
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 1400);
  });
}

async function load(){
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if(!r.ok) throw new Error(r.status === 403 ? "Limit zapytań GitHuba — spróbuj za kilka minut." : "Błąd " + r.status);
    const data = await r.json();
    const files = data.tree.filter(f => f.type === "blob" && (IMG.test(f.path) || OTHER.test(f.path)));
    render(files);
  }catch(e){
    app.innerHTML = `<div class="status">Nie udało się wczytać listy plików. ${esc(e.message)}</div>`;
  }
}

function render(files){
  const groups = {};
  files.forEach(f => {
    const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/")) : "główny folder";
    (groups[dir] ||= []).push(f);
  });
  const dirs = Object.keys(groups).sort();
  nav.innerHTML = dirs.map(d => `<a href="#${encodeURIComponent(d)}">${esc(d)} (${groups[d].length})</a>`).join("");
  app.innerHTML = dirs.map(d => `
    <section id="${encodeURIComponent(d)}" data-dir="${esc(d)}">
      <h2>${esc(d)} <small>${groups[d].length} plików</small></h2>
      <div class="grid">${groups[d].sort((a,b)=>a.path.localeCompare(b.path)).map(card).join("")}</div>
    </section>`).join("") || `<div class="status">Brak plików.</div>`;

  app.querySelectorAll("img[data-dims]").forEach(img => {
    img.addEventListener("load", () => {
      img.closest(".card").querySelector(".dims").prepend(`${img.naturalWidth}×${img.naturalHeight}px · `);
    });
  });
  app.addEventListener("click", e => {
    const b = e.target.closest("button[data-copy]");
    if(!b) return;
    const url = b.dataset.url;
    if(b.dataset.copy === "link") copy(url, "Link skopiowany ✓");
    else copy(`<img src="${url}" alt="Fundacja Cyrkarium" width="120" style="display:block;border:0;">`, "Kod HTML skopiowany ✓");
  });
}

function card(f){
  const name = f.path.split("/").pop();
  const url = urlFor(f.path);
  const isImg = IMG.test(name);
  return `<div class="card" data-name="${esc(f.path.toLowerCase())}">
    <div class="thumb">${isImg ? `<img loading="lazy" src="${url}" alt="${esc(name)}" data-dims>` : `<span class="file">📄</span>`}</div>
    <div class="meta"><div class="name">${esc(name)}</div><div class="dims">${kb(f.size||0)}</div></div>
    <div class="actions">
      <button data-copy="link" data-url="${url}">Kopiuj link</button>
      ${isImg ? `<button data-copy="html" data-url="${url}">Kopiuj &lt;img&gt;</button>` : ""}
      <a href="${url}" target="_blank" rel="noopener">Otwórz</a>
    </div>
  </div>`;
}

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(c => c.style.display = c.dataset.name.includes(q) ? "" : "none");
  document.querySelectorAll("section").forEach(s => {
    s.style.display = [...s.querySelectorAll(".card")].some(c => c.style.display !== "none") ? "" : "none";
  });
});
document.getElementById("dark").addEventListener("change", e => document.body.classList.toggle("dark", e.target.checked));

load();
</script>
</body>
</html>
